events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api_server { zone api 64k; server backend:8000 resolve; }
    upstream web_server { zone web 64k; server frontend:3000 resolve; }
    # The only ingress is Caddy on the private edge network.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=lead:10m rate=1r/s;
    limit_req_status 429;
    client_max_body_size 26m;
    client_body_timeout 20s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    server {
        listen 80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        location = /api/auth/login {
            client_max_body_size 16k;
            limit_req zone=login burst=250 nodelay;
            proxy_pass http://api_server/auth/login;
        }
        location = /api/leads {
            client_max_body_size 16k;
            limit_req zone=lead burst=20 nodelay;
            proxy_pass http://api_server/leads;
        }
        location /api/ {
            proxy_pass http://api_server/;
        }
        location / {
            proxy_pass http://web_server;
        }
    }
}
